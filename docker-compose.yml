version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alton_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-alton_testnet}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alton_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: alton_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - alton_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alton_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-alton_testnet}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      DB_LOGGING: ${DB_LOGGING:-true}
      GRAPHQL_DEBUG: ${GRAPHQL_DEBUG:-true}
      GRAPHQL_EXPLORER: ${GRAPHQL_EXPLORER:-true}
      GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION:-true}
      INDEXER_ENABLED: ${INDEXER_ENABLED:-true}
      INDEXER_INTERVAL: ${INDEXER_INTERVAL:-30000}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - alton_network
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alton_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - alton_network
    command: npm run dev

networks:
  alton_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local 